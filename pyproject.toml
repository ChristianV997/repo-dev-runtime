[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-dev-runtime"
version = "0.1.0"
description = "Governed, repository-agnostic multi-agent coding runtime"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["repo_dev_runtime*"]
