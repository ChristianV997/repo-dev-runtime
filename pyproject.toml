[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-dev-runtime"
version = "0.1.0"
description = "Governed, repository-agnostic multi-agent coding runtime"
requires-python = ">=3.11"

[project.scripts]
repo-dev-runtime-install = "repo_dev_runtime.scaffold.installer:_console_entry_point"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["repo_dev_runtime*"]

[tool.ruff.lint]
# Scoped to genuine-bug signal (unused imports/vars, undefined names, syntax
# errors) rather than ruff's broader default rule set (import sorting,
# typing modernization, style preferences) — those would force a large,
# low-value reformatting diff across files with no correctness change.
# See docs/type-and-lint-policy.md for the mypy decision alongside this one.
select = ["F", "E9"]
