rules:
  - id: devstack-request-without-timeout
    languages: [python]
    message: External requests must specify a bounded timeout.
    severity: WARNING
    patterns:
      - pattern: requests.$METHOD(...)
      - pattern-not: requests.$METHOD(..., timeout=..., ...)
    paths:
      exclude: ["**/tests/**", "**/scripts/**"]

  - id: devstack-subprocess-shell-true
    languages: [python]
    message: Review shell=True for injection and portability risk.
    severity: ERROR
    pattern: subprocess.$METHOD(..., shell=True, ...)
    paths:
      exclude: ["**/tests/**"]

  - id: devstack-external-write-call-review
    languages: [python]
    message: Review this external write call for dry-run, approval, idempotency, and risk-gate enforcement.
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern: $CLIENT.$METHOD(...)
          - metavariable-regex:
              metavariable: $CLIENT
              regex: "^(requests|_requests|client|_client|session|_session|api|_api|sdk|provider|target)$"
          - metavariable-regex:
              metavariable: $METHOD
              regex: "^(post|put|patch|delete)$"
      - patterns:
          - pattern: $TARGET.$METHOD(...)
          - metavariable-regex:
              metavariable: $TARGET
              regex: "^(self|target|provider|api|_api|client|_client|sdk)$"
          - metavariable-regex:
              metavariable: $METHOD
              regex: "^(create_campaign|create_ad_group|create_ad|create_order|create_cart|fulfill_order|publish_bundle|publish|charge|launch|delete)$"
    # This rule runs repo-wide by default. If your repo has a specific
    # security-sensitive subtree (e.g. payments/orders/integrations),
    # restrict it by adding, e.g.:
    #   paths:
    #     include: ["**/backend/**", "**/connectors/**", "**/orchestrator/**"]
