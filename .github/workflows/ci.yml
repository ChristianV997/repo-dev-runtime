name: repo-dev-runtime

on:
  push:
    branches: [main]
  # Validate stacked and release-branch PRs as well as PRs targeting main.
  # The workflow has read-only permissions and no secrets or live providers.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest ruff
      - name: Run tests
        run: python -m pytest -q
      - name: Lint (ruff)
        # Scoped to F (pyflakes: unused imports/vars, undefined names) and
        # E9 (syntax errors) — see [tool.ruff.lint] in pyproject.toml for why
        # ruff's broader default rule set (import sorting, typing
        # modernization) isn't gated on here.
        run: python -m ruff check repo_dev_runtime tests scripts
      - name: Compile sources
        run: python -m compileall -q repo_dev_runtime tests scripts
      - name: Validate provenance inventory
        run: python -m json.tool provenance/source_inventory.json > /dev/null
      - name: Fixture benchmark regression gate
        # Deterministic, offline, fake-provider only: no third-party agent is
        # installed or executed in CI, and no live provider is contacted.
        run: |
          python -m repo_dev_runtime.cli benchmark \
            --provider fake --fake-reviewer \
            --fixtures-root "${RUNNER_TEMP}/benchmark-fixtures" \
            --json-out "${RUNNER_TEMP}/benchmark.json"
          PYTHONPATH=. python scripts/check_benchmark_report.py "${RUNNER_TEMP}/benchmark.json"
      - name: Check whitespace
        run: git diff --check

  test-windows:
    # Windows-specific code paths (scheduler.py's msvcrt locking,
    # runtimes/aider.py's/sensors/agent_reach.py's CREATE_NEW_PROCESS_GROUP +
    # taskkill process-tree kill, the posix=os.name != "nt" shlex guards)
    # were previously exercised only by unit tests that mock os.name, never
    # by an actual Windows process. This job is the one thing that turns
    # "cross-platform by design" into "cross-platform, CI-verified."
    # Scoped to the test suite only - ruff/compileall/the benchmark gate
    # are platform-agnostic and already covered by the Linux job above.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run tests
        run: python -m pytest -q
