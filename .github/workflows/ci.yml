name: repo-dev-runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q repo_dev_runtime tests
      - name: Check whitespace
        run: git diff --check
