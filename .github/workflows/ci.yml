name: repo-dev-runtime

on:
  push:
    branches: [main]
  # Validate stacked and release-branch PRs as well as PRs targeting main.
  # The workflow has read-only permissions and no secrets or live providers.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q repo_dev_runtime tests
      - name: Validate provenance inventory
        run: python -m json.tool provenance/source_inventory.json > /dev/null
      - name: Fixture benchmark regression gate
        # Deterministic, offline, fake-provider only: no third-party agent is
        # installed or executed in CI, and no live provider is contacted.
        run: |
          python -m repo_dev_runtime.cli benchmark \
            --provider fake --fake-reviewer \
            --fixtures-root "${RUNNER_TEMP}/benchmark-fixtures" \
            --json-out "${RUNNER_TEMP}/benchmark.json"
          PYTHONPATH=. python scripts/check_benchmark_report.py "${RUNNER_TEMP}/benchmark.json"
      - name: Check whitespace
        run: git diff --check
